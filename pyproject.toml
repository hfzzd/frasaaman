[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frasaaman"
version = "0.2.0"
description = "Generator passphrase diceware Bahasa Indonesia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
frasaaman = "frasaaman.cli:main"

[tool.setuptools.packages.find]
include = ["frasaaman*"]

[tool.setuptools.package-data]
frasaaman = ["kata.txt"]
